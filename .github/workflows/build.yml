# Builds ArgusCode for macOS (universal) and Windows (amd64).
# - Every push / pull request: tests + build, binaries attached as workflow artifacts.
# - Tags "v*" (e.g. v0.4.0): also publishes a GitHub Release with the binaries.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: ArgusCode-macos-universal.zip
          - os: windows-latest
            platform: windows/amd64
            artifact: ArgusCode-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Go tests
        run: go test ./internal/...

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -trimpath -ldflags "-s -w"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/ArgusCode.app ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/ArgusCode.exe -DestinationPath ${{ matrix.artifact }}

      - name: Size report
        shell: bash
        run: ls -la build/bin ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
