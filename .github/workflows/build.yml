# Builds ArgusCode for macOS (universal) and Windows (amd64).
# - Every push / pull request: tests + build, binaries attached as workflow artifacts.
# - Tags "v*" (e.g. v0.4.0): also publishes a GitHub Release with the binaries.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: ArgusCode-macos-universal.zip
          - os: windows-latest
            platform: windows/amd64
            artifact: ArgusCode-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Go version comes from go.mod. Keep it >= 1.23: older linkers omit the
      # LC_UUID load command, which macOS 15 dyld rejects ("missing LC_UUID").
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2

      - name: Go tests
        run: go test ./internal/...

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -trimpath -ldflags "-s -w"

      # Sign the whole bundle. Without it the app only carries the Go linker's
      # per-binary signature and macOS privacy (TCC) cannot remember folder
      # permissions ("ArgusCode이(가) 데스크탑 폴더에 접근하려고 합니다" on every launch).
      # - Secret MACOS_CERT_P12 (base64 .p12) + MACOS_CERT_PASSWORD set: signed
      #   with that certificate (a self-signed one is enough), so permissions
      #   survive app updates.
      # - Otherwise ad-hoc: permissions are remembered until the next version.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          APP=build/bin/ArgusCode.app
          IDENTITY=-
          if [ -n "$MACOS_CERT_P12" ]; then
            KC="$RUNNER_TEMP/sign.keychain-db"
            security create-keychain -p ci "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p ci "$KC"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            IDENTITY=$(security find-identity -p codesigning "$KC" | awk -F'"' '/"/ {print $2; exit}')
            echo "Signing with: $IDENTITY"
          else
            echo "MACOS_CERT_P12 not set: ad-hoc signing"
          fi
          codesign --force --deep --sign "$IDENTITY" "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier|Authority|Signature' || true
          codesign -d -r- "$APP" 2>&1 | tail -1

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/ArgusCode.app ${{ matrix.artifact }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/ArgusCode.exe -DestinationPath ${{ matrix.artifact }}

      # Checksum next to each archive: the in-app updater verifies downloads
      # with it when the GitHub API (which also lists digests) is rate limited.
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"; fi
          cat "${{ matrix.artifact }}.sha256"

      - name: Size report
        shell: bash
        run: ls -la build/bin ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      # release-notes/<tag>.md becomes the release body (shown in the app after
      # an update); without it GitHub's generated change list is used.
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; echo "using $f"; fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
